name: Build BalloonPop APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 (required by Android Gradle Plugin 8.x)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node (needed for npm install → @capacitor/android in node_modules)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Install npm dependencies (@capacitor/android, @capacitor/core etc.)
      - name: Install npm dependencies
        run: npm ci

      # 5. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 7. Copy web assets into Android project
      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 8. Build debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BalloonPop-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. Summary
      - name: Build summary
        run: |
          echo "## 🎈 BalloonPop APK Built!" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
          echo "Transfer to your Android phone and tap to install." >> $GITHUB_STEP_SUMMARY
