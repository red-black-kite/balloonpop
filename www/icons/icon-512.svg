<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 100 100'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='40%'>
      <stop offset='0%' stop-color='#5BC8F5'/>
      <stop offset='100%' stop-color='#2196F3'/>
    </radialGradient>
    <radialGradient id='b1' cx='35%' cy='30%'>
      <stop offset='0%' stop-color='#ff9ff3'/>
      <stop offset='100%' stop-color='#ff6b6b'/>
    </radialGradient>
    <radialGradient id='b2' cx='35%' cy='30%'>
      <stop offset='0%' stop-color='#7bed9f'/>
      <stop offset='100%' stop-color='#1dd1a1'/>
    </radialGradient>
    <radialGradient id='b3' cx='35%' cy='30%'>
      <stop offset='0%' stop-color='#74b9ff'/>
      <stop offset='100%' stop-color='#54a0ff'/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <rect width='100' height='100' rx='22' fill='url(#bg)'/>
  <!-- Balloon 1 (left) -->
  <ellipse cx='28' cy='42' rx='14' ry='17' fill='url(#b1)'/>
  <ellipse cx='24' cy='36' rx='5' ry='4' fill='rgba(255,255,255,.3)'/>
  <line x1='28' y1='59' x2='28' y2='72' stroke='rgba(0,0,0,.3)' stroke-width='1.5'/>
  <!-- Balloon 2 (center) -->
  <ellipse cx='50' cy='36' rx='16' ry='19' fill='url(#b3)'/>
  <ellipse cx='45' cy='29' rx='5' ry='4' fill='rgba(255,255,255,.3)'/>
  <line x1='50' y1='55' x2='50' y2='72' stroke='rgba(0,0,0,.3)' stroke-width='1.5'/>
  <!-- Balloon 3 (right) -->
  <ellipse cx='72' cy='42' rx='14' ry='17' fill='url(#b2)'/>
  <ellipse cx='68' cy='36' rx='5' ry='4' fill='rgba(255,255,255,.3)'/>
  <line x1='72' y1='59' x2='72' y2='72' stroke='rgba(0,0,0,.3)' stroke-width='1.5'/>
  <!-- Letters A B C on balloons -->
  <text x='28' y='47' font-family='Arial Black,sans-serif' font-size='11' font-weight='900' fill='white' text-anchor='middle'>A</text>
  <text x='50' y='41' font-family='Arial Black,sans-serif' font-size='13' font-weight='900' fill='white' text-anchor='middle'>B</text>
  <text x='72' y='47' font-family='Arial Black,sans-serif' font-size='11' font-weight='900' fill='white' text-anchor='middle'>C</text>
  <!-- Ground line -->
  <rect x='5' y='78' width='90' height='17' rx='4' fill='#4CAF50'/>
  <!-- Stars -->
  <text x='15' y='92' font-size='10'>⭐</text>
  <text x='45' y='93' font-size='10'>⭐</text>
  <text x='72' y='92' font-size='10'>⭐</text>
</svg>